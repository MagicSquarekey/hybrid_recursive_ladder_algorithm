name: Publish to MCP Registry

# Metadata-only publish: the PyPI packages are uploaded by hand, this workflow
# only registers server.json with the official MCP Registry over GitHub OIDC.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to the registry; no secret needed
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: |
          set +e
          ./mcp-publisher publish 2>&1 | tee publish.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # The job log lives behind a blob host that is not always reachable,
            # so surface the reason as an annotation on the run.
            msg=$(tail -n 12 publish.log | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=MCP Registry publish failed::$msg"
          fi
          exit "$rc"

      - name: Verify the listing
        run: |
          name=$(python -c "import json;print(json.load(open('server.json'))['name'])")
          curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name" | head -c 2000
