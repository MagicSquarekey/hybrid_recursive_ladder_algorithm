<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">一份查询计划，两条读取路径</title>
  <desc id="desc">上：分解，按取数层级和连续性对 run 分组，每个 run 在桶数上限内取一次，本地折叠。下：按覆盖切分每个段，已覆盖部分本地求和，未覆盖部分取源，再合并两者。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc" />
  <text x="48" y="50" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="28.0" font-weight="700" fill="#0f172a">一份查询计划，两条读取路径</text>
  <text x="48" y="78" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.0" fill="#475569">纯源路径负责规划请求；本地优先路径还会复用已固化的覆盖。</text>

  
  <text x="48" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.0" font-weight="700" fill="#0f766e">纯源读取</text>
  <rect x="40" y="140" width="220" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" />
  <text x="60" y="174" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">日历分解</text>
  <text x="60" y="198" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">只输出完整单位</text>
  <text x="60" y="216" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">残边下沉到更细层</text>

  <rect x="300" y="140" width="250" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" />
  <text x="320" y="174" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">对 run 分组</text>
  <text x="320" y="198" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">取数层级 + 连续性</text>
  <text x="320" y="216" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">仅相邻不算</text>

  <rect x="590" y="140" width="250" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" />
  <text x="610" y="174" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">每个 run 取一次</text>
  <text x="610" y="198" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">每请求 ≤ K 个桶</text>
  <text x="610" y="216" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">下一级更细聚合</text>

  <rect x="880" y="140" width="180" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" />
  <text x="900" y="174" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">本地折叠</text>
  <text x="900" y="198" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">把桶求和为</text>
  <text x="900" y="216" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">输出段</text>

  <path d="M 260 185 L 300 185" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)" />
  <path d="M 550 185 L 590 185" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)" />
  <path d="M 840 185 L 880 185" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)" />

  <rect x="40" y="260" width="220" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4" />
  <text x="150" y="282" text-anchor="middle" font-family="'Noto Sans SC', Consolas, monospace" font-size="12.0" fill="#0f766e">月 → 日桶</text>
  <rect x="280" y="260" width="220" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4" />
  <text x="390" y="282" text-anchor="middle" font-family="'Noto Sans SC', Consolas, monospace" font-size="12.0" fill="#0f766e">日 → 小时桶</text>
  <rect x="520" y="260" width="260" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4" />
  <text x="650" y="282" text-anchor="middle" font-family="'Noto Sans SC', Consolas, monospace" font-size="12.0" fill="#0f766e">小时 + 分钟 → 分钟</text>
  <rect x="800" y="260" width="260" height="34" rx="17" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="930" y="282" text-anchor="middle" font-family="'Noto Sans SC', Consolas, monospace" font-size="12.0" fill="#047857">97 段 · 约 5–7 次请求</text>

  
  <text x="48" y="350" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.0" font-weight="700" fill="#15803d">本地优先读取</text>

  <rect x="40" y="380" width="150" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="60" y="414" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">段</text>
  <text x="60" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">[start, end)</text>

  <rect x="230" y="380" width="210" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="250" y="414" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">按覆盖</text>
  <text x="250" y="438" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">切分</text>

  <rect x="490" y="325" width="250" height="70" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="510" y="354" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.0" font-weight="700" fill="#166534">已覆盖</text>
  <text x="510" y="376" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#166534">一条批量本地 SQL 求和</text>

  <rect x="490" y="425" width="250" height="70" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
  <text x="510" y="454" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.0" font-weight="700" fill="#9a3412">未覆盖</text>
  <text x="510" y="476" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#9a3412">取源，分组或部分</text>

  <rect x="800" y="380" width="190" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="820" y="414" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">合并</text>
  <text x="820" y="438" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">本地 + 源</text>

  <rect x="1030" y="380" width="130" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="1050" y="414" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16.0" font-weight="700" fill="#0f172a">取值</text>
  <text x="1050" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">local | tb | mixed</text>

  <path d="M 190 420 L 230 420" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)" />
  <path d="M 440 410 C 465 410, 465 360, 490 360" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)" />
  <path d="M 440 430 C 465 430, 465 460, 490 460" stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)" />
  <path d="M 740 360 C 770 360, 770 410, 800 410" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)" />
  <path d="M 740 460 C 770 460, 770 430, 800 430" stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)" />
  <path d="M 990 420 L 1030 420" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)" />

  
  <text x="230" y="520" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">该段的覆盖情况</text>
  <rect x="230" y="530" width="500" height="20" rx="7" fill="#fee2e2" stroke="#fecaca" />
  <rect x="230" y="530" width="300" height="20" rx="7" fill="#bbf7d0" stroke="#86efac" />
  <text x="245" y="545" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#166534">已覆盖</text>
  <text x="620" y="545" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#b91c1c">未覆盖</text>

  <text x="48" y="600" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#475569">覆盖只记录到 now − 5 分钟；拉取失败会在下次读取前使其失效。</text>
  <text x="48" y="624" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#475569">即使源端返回零个点，区间也会被标记为已覆盖：「问过了，确实没有」。</text>
  <text x="48" y="660" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#64748b">同一套段模型驱动 sum、verify 和 repair。</text>
</svg>