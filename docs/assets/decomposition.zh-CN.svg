<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">十个月区间的日历分解</title>
  <desc id="desc">区间先切成 9 个完整月，再把不完整的 10 月切成 20 天，把 10 月 21 日切成 18 个小时，把不完整的小时切成 49 分钟和 1 个零头：一共 97 段。</desc>

  <rect width="1200" height="640" fill="#f8fafc" />
  <text x="48" y="50" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="28.0" font-weight="700" fill="#0f172a">一个区间，四层，97 段</text>
  <text x="48" y="78" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.0" fill="#475569">逐层剥离完整单位，把左右残边下沉到下一层。</text>

  
  <text x="48" y="141" font-family="'Noto Sans SC', Consolas, monospace" font-size="13.0" fill="#475569">完整区间</text>
  <text x="1120" y="116" text-anchor="end" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#0f766e">9 个完整月</text>
