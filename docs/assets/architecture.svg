<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">One query plan, two read paths</title>
  <desc id="desc">Top: decompose, group runs by fetch level and contiguity, fetch each run once within the bucket limit, and fold locally. Bottom: split each segment against coverage, sum covered parts locally, fetch uncovered parts from the source, and merge the two.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="48" y="50" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">One query plan, two read paths</text>
  <text x="48" y="78" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">The source path plans requests. The local-first path also reuses materialized coverage.</text>

  <!-- source-only -->
  <text x="48" y="120" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">Source-only read</text>
  <rect x="40" y="140" width="220" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="60" y="174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Calendar decomposition</text>
  <text x="60" y="198" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">complete units only</text>
  <text x="60" y="216" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">partial edges go finer</text>

  <rect x="300" y="140" width="250" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="320" y="174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Group runs</text>
  <text x="320" y="198" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">fetch level + contiguity</text>
  <text x="320" y="216" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">never adjacency alone</text>

  <rect x="590" y="140" width="250" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="610" y="174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Fetch once per run</text>
  <text x="610" y="198" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">≤ K buckets per request</text>
  <text x="610" y="216" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">next finer aggregation</text>

  <rect x="880" y="140" width="180" height="90" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="900" y="174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Fold locally</text>
  <text x="900" y="198" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">sum buckets into</text>
  <text x="900" y="216" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">output segments</text>

  <path d="M 260 185 L 300 185" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 550 185 L 590 185" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 840 185 L 880 185" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>

  <rect x="40" y="260" width="220" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="150" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0f766e">months → day buckets</text>
  <rect x="280" y="260" width="220" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="390" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0f766e">days → hour buckets</text>
  <rect x="520" y="260" width="260" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="650" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0f766e">hours + minutes → minute</text>
  <rect x="800" y="260" width="260" height="34" rx="17" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="930" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#047857">97 segments · ~5–7 requests</text>

  <!-- local-first -->
  <text x="48" y="350" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d">Local-first read</text>

  <rect x="40" y="380" width="150" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="414" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Segment</text>
  <text x="60" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">[start, end)</text>

  <rect x="230" y="380" width="210" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="250" y="414" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Split against</text>
  <text x="250" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">coverage</text>

  <rect x="490" y="325" width="250" height="70" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="510" y="354" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">Covered</text>
  <text x="510" y="376" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#166534">one batched local SQL sum</text>

  <rect x="490" y="425" width="250" height="70" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="510" y="454" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Uncovered</text>
  <text x="510" y="476" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">source fetch, grouped or partial</text>

  <rect x="800" y="380" width="190" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="820" y="414" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Merge</text>
  <text x="820" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">local + source</text>

  <rect x="1030" y="380" width="130" height="80" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="1050" y="414" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Value</text>
  <text x="1050" y="438" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">local | tb | mixed</text>

  <path d="M 190 420 L 230 420" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 440 410 C 465 410, 465 360, 490 360" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 440 430 C 465 430, 465 460, 490 460" stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 740 360 C 770 360, 770 410, 800 410" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 740 460 C 770 460, 770 430, 800 430" stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 990 420 L 1030 420" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- coverage bar -->
  <text x="230" y="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">coverage for the segment</text>
  <rect x="230" y="530" width="500" height="20" rx="7" fill="#fee2e2" stroke="#fecaca"/>
  <rect x="230" y="530" width="300" height="20" rx="7" fill="#bbf7d0" stroke="#86efac"/>
  <text x="245" y="545" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#166534">covered</text>
  <text x="620" y="545" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">uncovered</text>

  <text x="48" y="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Coverage is recorded only up to now − 5 minutes; a failed pull invalidates it before the next read.</text>
  <text x="48" y="624" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">A range is marked covered even when the source returned zero points: “we asked, there is nothing”.</text>
  <text x="48" y="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">The same segment model drives sum, verify and repair.</text>
</svg>
