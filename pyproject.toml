[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hybrid-recursive-ladder"
version = "0.0.5"
description = "Query planning for bucket-limited time-series APIs — aggregate long ranges with a handful of source requests instead of thousands of per-bucket queries."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "MagicSquarekey" }]
keywords = [
  "time-series",
  "aggregation",
  "thingsboard",
  "postgresql",
  "ladder",
  "segments",
  "observability",
  "iot",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
thingsboard = ["httpx>=0.27"]
postgres = ["psycopg[binary,pool]>=3.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp>=1.2"]
all = [
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "mcp>=1.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary,pool]>=3.1",
  "mcp>=1.2",
  "build>=1.2",
]

[project.scripts]
hybrid-ladder = "hybrid_ladder.cli:main"

[project.urls]
Homepage = "https://github.com/MagicSquarekey/hybrid_recursive_ladder_algorithm"
Repository = "https://github.com/MagicSquarekey/hybrid_recursive_ladder_algorithm"
Issues = "https://github.com/MagicSquarekey/hybrid_recursive_ladder_algorithm/issues"
Changelog = "https://github.com/MagicSquarekey/hybrid_recursive_ladder_algorithm/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_ladder"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/skills",
  "/README*.md",
  "/CHANGELOG*.md",
  "/CONTRIBUTING*.md",
  "/LICENSE*",
  "/CITATION.cff",
  "/.zenodo.json",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs a live PostgreSQL instance (set HL_TEST_PG_DSN)",
]

[tool.coverage.run]
source = ["hybrid_ladder"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv*", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "UP009"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The asset localizer is a translation table; CJK punctuation and other
# non-ASCII characters are the content, not typos.
"tools/localize_assets.py" = ["RUF001"]
